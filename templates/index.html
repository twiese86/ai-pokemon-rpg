<!DOCTYPE html>
<html>
<head>
    <title>AI RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; overflow: hidden; }
        .active { display: block !important; }
    </style>
</head>
<body class="p-4">
    <div id="exploreView" class="h-64 bg-zinc-900 flex items-center justify-center border-2 border-green-900 relative">
        <div id="player" class="absolute bg-green-500 w-8 h-8 transition-all duration-100"></div>
        <p id="walkMsg">Use Arrows to Walk</p>
    </div>

    <div id="battleView" class="hidden fixed inset-0 bg-black z-50 p-10 flex-col items-center">
        <h1 id="eName" class="text-xl mb-4 text-white"></h1>
        <div class="w-64 h-64 border-4 border-white mb-6 bg-white flex items-center justify-center">
            <img id="eImg" src="" class="max-w-full max-h-full" style="image-rendering: pixelated;">
        </div>
        <div id="moves" class="grid grid-cols-2 gap-4 w-full max-w-md"></div>
    </div>

    <div class="mt-4 p-4 border-2 border-green-900">
        <p class="text-xs">HP: <span id="hp">100</span> | LOG: <span id="log"></span></p>
    </div>

    <script>
        let x=50, y=50, steps=0, battling=false;
        const player = document.getElementById('player');

        window.addEventListener('keydown', (e) => {
            if (battling) return;
            if(e.key.includes("Arrow")) {
                if(e.key === "ArrowUp") y-=5; if(e.key === "ArrowDown") y+=5;
                if(e.key === "ArrowLeft") x-=5; if(e.key === "ArrowRight") x+=5;
                player.style.top = y+"%"; player.style.left = x+"%";
                steps++; if(steps > 15) { steps=0; send('Explore'); }
            }
        });

        async function send(act) {
            const res = await fetch('/action', {method: 'POST', body: new URLSearchParams({'action': act})});
            const state = await res.json();
            document.getElementById('log').innerText = state.log;
            document.getElementById('hp').innerText = state.player_hp;

            if (state.mode === "BATTLE") {
                battling = true;
                document.getElementById('battleView').classList.add('active');
                document.getElementById('eName').innerText = state.enemy.name;
                
                // IMAGE URL CONSTRUCTOR
                const cleanPrompt = state.enemy.sprite.replace(/\s+/g, '-');
                const imgUrl = `https://pollinations.ai/p/${cleanPrompt}?width=300&height=300&seed=${Math.floor(Math.random()*1000)}&nologo=true`;
                document.getElementById('eImg').src = imgUrl;

                const mDiv = document.getElementById('moves'); mDiv.innerHTML = '';
                state.enemy.moves.forEach(m => {
                    mDiv.innerHTML += `<button onclick="send('${m}')" class="bg-white text-black p-2 border-2 border-gray-500">${m}</button>`;
                });
            } else {
                battling = false;
                document.getElementById('battleView').classList.remove('active');
            }
        }
    </script>
</body>
</html>
    </div>
</body>
</html>
