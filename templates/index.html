<!DOCTYPE html>
<html>
<head>
    <title>AI POKEMON WORLD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { font-family: 'Press Start 2P', cursive; background: #111; color: #fff; overflow: hidden; }
        #gameCanvas { border: 4px solid #444; background: #000; image-rendering: pixelated; }
        .battle-overlay { display: none; background: rgba(0,0,0,0.9); position: absolute; top:0; left:0; width:100%; height:100%; }
        .active { display: flex !important; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
    <div class="mb-4 text-[10px]">USE ARROW KEYS TO WALK - FIND THE BOSS</div>
    
    <div class="relative">
        <canvas id="gameCanvas" width="600" height="400"></canvas>

        <div id="battleScreen" class="battle-overlay flex-col items-center justify-center p-10">
            <h2 id="battleText" class="text-sm mb-10 text-center"></h2>
            <img id="enemySprite" src="" class="w-48 h-48 mb-8 animate-bounce">
            <div class="flex gap-4">
                <button onclick="endBattle()" class="bg-red-600 p-4 text-[10px]">RUN AWAY</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const battleScreen = document.getElementById('battleScreen');
        
        let player = { x: 300, y: 200, steps: 0 };
        let mapImg = new Image();
        mapImg.src = "https://pollinations.ai/p/{{ state.map_theme|urlencode }}?width=1024&height=1024&model=turbo&seed=42";
        
        let playerImg = new Image();
        playerImg.src = "https://pollinations.ai/p/pixel%20art%20boy%20trainer%20sprite%20facing%20forward?width=64&height=64&nologo=true";

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw Map
            ctx.drawImage(mapImg, 0, 0, canvas.width, canvas.height);
            // Draw Player (with a slight "walk" bounce)
            const bounce = Math.sin(Date.now() / 100) * 5;
            ctx.drawImage(playerImg, player.x, player.y + bounce, 40, 40);
            requestAnimationFrame(draw);
        }

        window.addEventListener('keydown', async (e) => {
            if (battleScreen.classList.contains('active')) return;
            
            const speed = 10;
            if (e.key === "ArrowUp") player.y -= speed;
            if (e.key === "ArrowDown") player.y += speed;
            if (e.key === "ArrowLeft") player.x -= speed;
            if (e.key === "ArrowRight") player.x += speed;

            player.steps++;
            if (player.steps > 30) { // Trigger encounter every 30 movements
                player.steps = 0;
                const res = await fetch('/encounter', {method: 'POST'});
                const data = await res.json();
                startBattle(data);
            }
        });

        function startBattle(data) {
            document.getElementById('battleText').innerText = data.log;
            document.getElementById('enemySprite').src = `https://pollinations.ai/p/${encodeURIComponent(data.current_enemy.sprite)}?width=300&height=300&model=turbo`;
            battleScreen.classList.add('active');
        }

        function endBattle() {
            fetch('/reset', {method: 'POST'});
            battleScreen.classList.remove('active');
        }

        mapImg.onload = draw;
    </script>
</body>
</html>
    </div>
</body>
</html>
